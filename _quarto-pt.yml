# Portuguese profile — the default version (see CONTEXT.md "Default version").
# Render with: quarto render --profile pt
project:
  output-dir: docs/pt
  render:
    - "*.pt.qmd"
    - "posts/*.pt.qmd"
    # copom-tone-index/ é um projeto Quarto à parte (tem seu próprio
    # _quarto.yml) — excluído por precaução, mesmo que nenhum arquivo de
    # lá bata com "*.pt.qmd" hoje.
    - "!copom-tone-index/**"

lang: pt

website:
  title: "**Leonardo Sapienza**"
  description: "Site pessoal de Leonardo Sapienza - Analisando o cenário macro e ajudando pessoas e empresas a decidir melhor."
  navbar:
    left:
      - href: index.pt.qmd
        text: Início
      - href: about.pt.qmd
        text: Sobre
      - href: blog.pt.qmd
        text: Blog
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/leonardo-sapienza
        aria-label: LinkedIn
        target: _blank
      - icon: envelope
        href: mailto:ldsapienza@uol.com.br
        aria-label: Email
      - text: EN
        href: "#language-switch"
        aria-label: "View in English"
  page-footer:
    center: "© 2026 Leonardo Sapienza · versão em português"
