# Portuguese profile — the default version (see CONTEXT.md "Default version").
# Render with: quarto render --profile pt
project:
  output-dir: docs/pt
  render:
    - "*.pt.qmd"
    - "posts/*.pt.qmd"

lang: pt

website:
  title: "Seu Nome"
  description: "Site pessoal de Seu Nome — substitua por uma descrição real em uma linha."
  navbar:
    left:
      - href: index.pt.qmd
        text: Início
      - href: about.pt.qmd
        text: Sobre
      - href: blog.pt.qmd
        text: Blog
    right:
      - text: EN
        href: "#language-switch"
        aria-label: "View in English"
  page-footer:
    center: "© 2026 Seu Nome · versão em português"
