name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::downlit
            any::xml2
            # adicione aqui os pacotes que o seu post usa com library(...)
            # ex.: any::ggplot2, any::dplyr

      # build.ps1 já renderiza os dois profiles (en/pt), escreve o
      # dispatcher e os redirects de legacy URL, e copia os PDFs de CV —
      # reaproveitado tal como está, sem reescrever a lógica em bash.
      # Runners Ubuntu do GitHub Actions já vêm com PowerShell (pwsh).
      - name: Build site (build.ps1)
        shell: pwsh
        run: ./build.ps1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
