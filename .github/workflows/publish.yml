name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # O estágio 4/4 do resumo-focus (.github/workflows/focus-blog.yml) commita
  # o post do blog usando o GITHUB_TOKEN padrão do job dele, e um push feito
  # com esse token NÃO dispara outros workflows via `on: push` (proteção do
  # GitHub contra loop recursivo) — sem este gatilho extra, o post seria
  # commitado mas o site nunca seria reconstruído com ele.
  workflow_run:
    workflows: ["Focus (4/4) - Publicação no blog"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Só constrói por causa do workflow_run se ele tiver terminado com
    # sucesso (evitar reconstruir o site a partir de um commit que nunca
    # chegou a ser feito, caso o estágio 4/4 falhe).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c(
            'knitr', 'rmarkdown', 'downlit', 'xml2', 'kableExtra', 
            'fredr', 'rbcb', 'sidrar', 'dplyr', 'RcppRoll', 
            'tsibble', 'lubridate', 'purrr', 'tidyr', 'imputeTS', 
            'forecast', 'mFilter', 'bimets', 'glue', 'jsonlite', 
            'seasonal', 'stringr', 'ggplot2','fabletools','feasts' 
          ))"
        #uses: r-lib/actions/setup-r-dependencies@v2
        #with:
         # packages: |
          #  any::knitr
           # any::rmarkdown
           # any::downlit
            # any::xml2
            # any::kableExtra
            # any::fredr
            # any::rbcb
            # any::sidrar
            # any::dplyr
            # any::RcppRoll
            # any::tsibble
            # any::lubridate
            # any::purrr
            # any::tidyr
            # any::imputeTS
            # any::forecast
            # any::mFilter
            # any::bimets
            # any::glue
            # any::jsonlite
            # any::seasonal
            # any::stringr
            # any::ggplot2
            
            
                               


      - name: Build site (build.ps1)
        shell: pwsh
        run: ./build.ps1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
