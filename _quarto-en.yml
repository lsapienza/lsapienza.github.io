# English profile. Render with: quarto render --profile en
# Owns everything that differs for the English version: output location,
# lang, navbar, footer, site description. See CONTEXT.md "Profile".
project:
  output-dir: docs/en
  render:
    - "*.qmd"
    - "posts/*.qmd"
    - "!*.pt.qmd"
    - "!posts/*.pt.qmd"
    # copom-tone-index/ é um projeto Quarto à parte (tem seu próprio
    # _quarto.yml) — sem isso, "*.qmd" casa em qualquer profundidade e
    # varre o paper.qmd dele pra dentro do site pessoal.
    - "!copom-tone-index/**"

lang: en

website:
  title: "Your Name"
  description: "Personal site of Your Name — replace with a real one-line description."
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: blog.qmd
        text: Blog
    right:
      - icon: linkedin
        href: "https://www.linkedin.com/in/seu-usuario"
        aria-label: LinkedIn
        target: _blank
      - icon: envelope
        href: "mailto:seu-email@exemplo.com"
        aria-label: Email
      - text: PT
        href: "#language-switch"
        aria-label: "Ver em português"
  page-footer:
    center: "© 2026 Your Name · English version"
